version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://sashflow:password@db:5432/sashflow_db
      - DBMATE_DATABASE_URL=postgres://sashflow:password@db:5432/sashflow_db
      - REDIS_URL=redis://redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=clickhouse_password
      - CLICKHOUSE_DATABASE=timeseries_db
      - BETTER_AUTH_SECRET=your-super-secret-better-auth-key-change-this-in-production-32-chars-min
      - BETTER_AUTH_URL=http://localhost:3000
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - RESEND_API_KEY=your-resend-api-key-here
      - API_KEY=your-api-key-here
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3001
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

      frontend:
        build: ../frontend
        ports:
          - "3001:3000"
        environment:
          - NEXT_PUBLIC_API_URL=http://localhost:3000
          - BETTER_AUTH_SECRET=your-super-secret-better-auth-key-change-this-in-production-32-chars-min
          - BETTER_AUTH_URL=http://localhost:3000
        depends_on:
          - app
        restart: unless-stopped

      worker:
        build: ../worker
        ports:
          - "8000:8000"
        environment:
          - WORKER_ID=worker-1
          - BACKEND_URL=http://app:3000
          - REDIS_URL=redis://redis:6379
          - LOG_LEVEL=info
          - MAX_CONCURRENT_JOBS=5
          - MODEL_CACHE_TTL=3600
          - HEALTH_CHECK_INTERVAL=30
        depends_on:
          app:
            condition: service_healthy
          redis:
            condition: service_healthy
        restart: unless-stopped
        healthcheck:
          test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=sashflow_db
      - POSTGRES_USER=sashflow
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sashflow -d sashflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=timeseries_db
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse_password
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  clickhouse_data:
